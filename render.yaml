databases:
  - name: autoapply-db
    plan: free
    region: singapore
    ipAllowList: [] # Internal only

services:
  - type: web
    name: autoapply-ai-backend
    env: docker
    region: singapore
    plan: free
    ipAllowList: []
    # Using Docker solves Playwright dependency issues on Render.
    # buildCommand and startCommand are inherited from Dockerfile.
    envVars:
      - key: PYTHONPATH
        value: src
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoapply-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_ENV
        value: production

  - type: redis
    name: autoapply-redis
    plan: free
    region: singapore
    ipAllowList: [] # Internal only

  - type: web
    name: autoapply-celery-worker
    env: docker
    region: singapore
    plan: free
    ipAllowList: []
    # Override Dockerfile CMD for worker
    dockerCommand: celery -A finder.shared.celery_app worker --loglevel=info --concurrency=1 --pool=solo
    envVars:
      - key: PYTHONPATH
        value: src
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoapply-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: CELERY_WORKER_PROCESS
        value: "true"