services:
  - type: web
    name: autoapply-ai-backend
    env: python
    region: singapore
    plan: free
    ipAllowList: [] # Public access via Render's load balancer is handled automatically; internal only for direct IP

    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 src.finder.api.main:app

    # ── Health check ─────────────────────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Environment variables ────────────────────────────────────────────────
    envVars:
      - key: PYTHONPATH
        value: src

      - key: FLASK_ENV
        value: production

      - key: FLASK_DEBUG
        value: "0"

      - key: API_HOST
        value: "0.0.0.0"

      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"

      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "false"

      # ── Set these in Render Dashboard (DO NOT hardcode secrets) ────────────
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        sync: false   # e.g. Supabase/Postgres URL

      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-frontend.vercel.app

      - key: REDIS_URL
        fromService:
          type: redis
          name: autoapply-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

  - type: redis
    name: autoapply-redis
    plan: free
    region: singapore
    ipAllowList: [] # Internal only

  - type: worker
    name: autoapply-celery-worker
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: celery -A finder.shared.celery_app worker --loglevel=info --concurrency=1
    envVars:
      - key: PYTHONPATH
        value: src
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoapply-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: CELERY_WORKER_PROCESS
        value: "true"
