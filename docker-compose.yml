version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A finder.shared.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=src
      - DATABASE_URL=sqlite:///data/finder.db
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - redis
